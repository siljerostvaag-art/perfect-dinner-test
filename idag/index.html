<!doctype html>
<html lang="nb">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#f6efe4">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'none'; form-action 'none'; base-uri 'none'">
  <title>Hva kan jeg lage i dag?</title>
  <link rel="stylesheet" href="stil.css">
  <script type="module" src="app.mjs"></script>
</head>
<body>
  <header class="hero">
    <div class="hero-indre">
      <button type="button" id="bytt-sprak" class="sprakknapp">English</button>
      <svg class="hero-bilde" viewBox="0 0 160 120" aria-hidden="true" focusable="false">
        <path class="damp" d="M62 30c-6-8 6-12 0-22M80 28c-6-8 6-12 0-22M98 30c-6-8 6-12 0-22"/>
        <ellipse class="skygge" cx="80" cy="104" rx="58" ry="8"/>
        <path class="bolle" d="M22 56h116c0 26-24 44-58 44S22 82 22 56z"/>
        <path class="kant" d="M18 56h124"/>
        <circle class="mat a" cx="56" cy="52" r="9"/>
        <circle class="mat b" cx="76" cy="48" r="11"/>
        <circle class="mat c" cx="98" cy="51" r="9"/>
        <circle class="mat d" cx="114" cy="54" r="6"/>
        <circle class="mat e" cx="40" cy="55" r="5"/>
        <path class="blad" d="M86 44c6-10 18-10 22-6-6 8-16 9-22 6z"/>
      </svg>
      <h1 id="tittel">Hva kan jeg lage i dag?</h1>
      <p id="ingress" class="ingress"></p>
    </div>
  </header>

  <main>
    <noscript><p class="kort">Siden trenger JavaScript. / This page needs JavaScript.</p></noscript>

    <section class="steg" aria-labelledby="har-overskrift">
      <div class="steg-topp">
        <span class="nr" aria-hidden="true">1</span>
        <h2 id="har-overskrift"></h2>
      </div>
      <div id="varer"></div>
      <div class="felt">
        <label for="fritekst" id="fritekst-etikett"></label>
        <input type="text" id="fritekst" autocomplete="off" maxlength="200" aria-describedby="fritekst-hjelp">
        <p id="fritekst-hjelp" class="hjelp"></p>
      </div>
      <button type="button" id="nullstill" class="tekstknapp"></button>
    </section>

    <section class="steg allergi" aria-labelledby="allergi-overskrift">
      <div class="steg-topp">
        <span class="nr" aria-hidden="true">2</span>
        <h2 id="allergi-overskrift"></h2>
        <span id="valgfritt" class="merke"></span>
      </div>
      <p id="allergi-ingress"></p>
      <div id="allergier-forst" class="valg"></div>
      <details id="flere-allergier">
        <summary id="flere-allergier-tittel"></summary>
        <div id="allergier-flere" class="valg"></div>
      </details>
      <p id="allergi-mer" class="hjelp"></p>
    </section>

    <section class="steg" id="forslag" aria-labelledby="forslag-overskrift" tabindex="-1">
      <div class="steg-topp">
        <span class="nr" aria-hidden="true">3</span>
        <h2 id="forslag-overskrift"></h2>
      </div>
      <p id="status" class="hjelp" role="status"></p>
      <div id="resultat"></div>
    </section>
  </main>

  <footer><p id="bunntekst"></p></footer>

  <div id="bunnlinje" class="bunnlinje" hidden>
    <span id="valgt-tekst"></span>
    <a href="#forslag" id="se-forslag" class="knapp"></a>
  </div>
</body>
</html>
